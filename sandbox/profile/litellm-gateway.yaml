# OpenShell provider profile: the LiteLLM AI Gateway, as the agent's only model endpoint.
#
# The credential is the agent's LiteLLM virtual key (scripts/oci/deploy.sh issues
# it: the three routers only, a budget, a rate limit). The sandbox sees a
# placeholder in LITELLM_API_KEY; the OpenShell proxy swaps in the real key on
# requests to the gateway, and nowhere else. OCI credentials never reach the
# sandbox: the gateway signs every OCI call itself.
#
#   openshell provider profile import --file sandbox/profile/litellm-gateway.yaml --global
#   scripts/openshell.sh provider     # creates the provider from ~/.config/litellmdemo/agent_key
id: litellm-gateway
display_name: LiteLLM AI Gateway (routing control room)
description: The LiteLLM gateway that classifies, routes and signs every model call; a scoped virtual key per agent
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: LiteLLM virtual key (models, budget and rate limit enforced by the gateway)
    env_vars: [LITELLM_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  # The LiteLLM gateway: scripts/openshell.sh renders __GATEWAY_HOST__ and
  # __GATEWAY_PORT__ (by default the local Kubernetes node and node port 30400).
  # An exact IP: OpenShell refuses host aliases (host.docker.internal) unless the
  # Docker driver's callback is itself an IP literal, and allows a declared address.
  - host: "__GATEWAY_HOST__"
    port: __GATEWAY_PORT__
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v1/chat/completions" }
      - allow: { method: GET, path: "/v1/models" }
binaries: [/usr/local/bin/python3.12]
