# What the control room's VM (scripts/oci/control.sh) needs from the cluster:
#
#   litellm-gateway-vcn   the gateway on node port 30400, for the VM and its
#                         OpenShell sandbox; the security list admits it from
#                         inside the VCN only
#   control-room          a service account that may read pods and their logs
#                         in litellmdemo (the console's LiteLLM and classifier
#                         lines), and nothing else
apiVersion: v1
kind: Service
metadata:
  name: litellm-gateway-vcn
  namespace: litellmdemo
  labels: {app.kubernetes.io/part-of: litellmdemo}
spec:
  type: NodePort
  selector: {app: litellm-gateway}
  ports:
    - {port: 4000, targetPort: 4000, nodePort: 30400}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-room
  namespace: litellmdemo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-room-logs
  namespace: litellmdemo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-room-logs
  namespace: litellmdemo
subjects:
  - {kind: ServiceAccount, name: control-room, namespace: litellmdemo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: control-room-logs}
---
apiVersion: v1
kind: Secret
metadata:
  name: control-room-token
  namespace: litellmdemo
  annotations: {kubernetes.io/service-account.name: control-room}
type: kubernetes.io/service-account-token
